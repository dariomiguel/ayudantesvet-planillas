<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Inicio</title>

    <!-- Boostrap core css -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>


<body class="bg-white">
    <!-- Header -->
    <header th:replace="~{fragments/header :: userHeader}"></header>

    <main class="container p-5 text-center">
        <h1>Inicio</h1>
        <h2 class="display-4">Planilla Circular 4301</h2>
    </main>

    <section class="container p-5 text-center">
        <form class="p-5" method="get" th:action="@{/exportar/planillassop-mensual/xlsx}">
            <button type="submit" class="btn btn-primary">Crear Excel</button>
        </form>
        <form class="p-5" method="get" th:action="@{/exportar/planillassop-diaria/pdf}">
            <button type="submit" class="btn btn-primary">Crear PDF</button>
        </form>
    </section>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>


</html>
